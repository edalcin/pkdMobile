name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and assemble debug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pkdmobile-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          PKD_KEYSTORE_BASE64: ${{ secrets.PKD_KEYSTORE_BASE64 }}
        run: |
          echo "$PKD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APK
        env:
          PKD_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PKD_KEYSTORE_PASSWORD: ${{ secrets.PKD_KEYSTORE_PASSWORD }}
          PKD_KEY_ALIAS: ${{ secrets.PKD_KEY_ALIAS }}
          PKD_KEY_PASSWORD: ${{ secrets.PKD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
